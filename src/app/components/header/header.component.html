<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-8">
    <!-- Zone 1: Brand Wordmark -->
    <a
      routerLink="/"
      (click)="closeMobileMenu()"
      class="inline-flex items-center gap-2.5 text-xl font-bold tracking-tight text-slate-900 whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sky-600 rounded-md"
    >
      <span
        class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-600 to-sky-600 text-white shrink-0"
        aria-hidden="true"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
        </svg>
      </span>
      <span class="bg-gradient-to-r from-emerald-700 to-sky-700 bg-clip-text text-transparent font-extrabold tracking-tight">LearnHub-Angular</span>
    </a>

    <!-- Zone 2: Primary Text Navigation -->
    <nav class="hidden md:flex items-center gap-7" aria-label="Primary navigation">
      <a
        routerLink="/"
        routerLinkActive="text-emerald-700 after:scale-x-100"
        [routerLinkActiveOptions]="{ exact: true }"
        class="relative py-1 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap shrink-0 after:content-[''] after:absolute after:left-0 after:right-0 after:-bottom-0.5 after:h-0.5 after:bg-emerald-600 after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:origin-left"
      >
        Home
      </a>
      <a
        routerLink="/articles"
        routerLinkActive="text-emerald-700 after:scale-x-100"
        class="relative py-1 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap shrink-0 after:content-[''] after:absolute after:left-0 after:right-0 after:-bottom-0.5 after:h-0.5 after:bg-emerald-600 after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:origin-left"
      >
        Articles
      </a>
      <a
        routerLink="/about"
        routerLinkActive="text-emerald-700 after:scale-x-100"
        class="relative py-1 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap shrink-0 after:content-[''] after:absolute after:left-0 after:right-0 after:-bottom-0.5 after:h-0.5 after:bg-emerald-600 after:scale-x-0 hover:after:scale-x-100 after:transition-transform after:origin-left"
      >
        About
      </a>
    </nav>

    <!-- Zone 3: Single Primary Action & Mobile Toggle -->
    <div class="flex items-center gap-3 shrink-0">
      <a
        routerLink="/add-article"
        class="hidden md:inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14" />
          <path d="M5 12h14" />
        </svg>
        <span>Add Article</span>
      </a>

      <button
        type="button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-navigation"
        aria-label="Toggle navigation menu"
        class="md:hidden inline-flex items-center justify-center w-11 h-11 rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-50 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600"
      >
        @if (mobileMenuOpen()) {
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        } @else {
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" x2="20" y1="6" y2="6" />
            <line x1="4" x2="20" y1="12" y2="12" />
            <line x1="4" x2="20" y1="18" y2="18" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation -->
  @if (mobileMenuOpen()) {
    <div id="mobile-navigation" class="md:hidden border-t border-slate-200 bg-white px-4 py-4 space-y-2">
      <a
        routerLink="/"
        (click)="closeMobileMenu()"
        routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block px-3 py-2.5 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-50 transition-colors"
      >
        Home
      </a>
      <a
        routerLink="/articles"
        (click)="closeMobileMenu()"
        routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
        class="block px-3 py-2.5 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-50 transition-colors"
      >
        Articles
      </a>
      <a
        routerLink="/about"
        (click)="closeMobileMenu()"
        routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
        class="block px-3 py-2.5 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-50 transition-colors"
      >
        About
      </a>
      <div class="pt-2 border-t border-slate-100">
        <a
          routerLink="/add-article"
          (click)="closeMobileMenu()"
          class="flex items-center justify-center gap-2 w-full px-4 py-2.5 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg transition-colors"
        >
          Add Article
        </a>
      </div>
    </div>
  }
</header>
